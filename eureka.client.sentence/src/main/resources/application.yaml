spring:
  application:
    name: eureka.client.sentence

server:
  port: ${PORT:${SERVER_PORT:0}}

eureka:
  instance:
    hostname: localhost
    instance-id: ${eureka.instance.hostname}:${spring.application.name}:${spring.application.instance_id:${random.value}}
  client:
    service-url:
      default-zone: http://localhost:8761
    registry-fetch-interval-seconds: 3

management:
  info:
    env:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info

info:
  application:
    name: ${spring.application.name}
    description: This application builds a full sentence by looking up other services
    version: '@project.version@'
