server:
  port: 8080

spring:
  application:
    name: gateway
  main:
    web-application-type: reactive
  cloud:
    gateway:
      # --- MODO AUTOMÁTICO (http://localhost:8080/eureka.client.subject, http://localhost:8080/eureka.client.verb, etc.) ---
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          # --- MODO MANUAL (http://localhost:8080/api/v1/sujetos/) ---
          routes:
            - id: servicio-frases                     # 1. RUTA (Identificador único)
              uri: lb://EUREKA.CLIENT.SENTENCE.FEIGN  # Donde enviamos la petición (vía Eureka)
              predicates:                             # 2. PREDICADOS (Las condiciones)
                - Path=/api/v1/frase/**               # Si la URL empieza por este path
                - Method=GET                          # Y además es una petición de lectura
              filters:                                # 3. FILTROS (La manipulación)
                - StripPrefix=2                       # Quita "/api/v1" de la URL original

eureka:
  instance:
    hostname: localhost
    instance-id: ${eureka.instance.hostname}:${spring.application.name}:${spring.application.instance_id:${random.value}}
  client:
    service-url:
      default-zone: http://localhost:8761

management:
  info:
    env:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info

info:
  application:
    name: ${spring.application.name}
    description: This is the API Gateway that centralizes access to all microservices
    version: '@project.version@'
